name: toets
on:
  # Push toetst alleen de langlevende takken. De regie pusht rechtstreeks naar `dev`
  # (zonder PR) en `main` draagt de uitgebrachte versies, dus die twee moeten bij élke
  # push door de poort. Een feature-branch toetst via zijn `pull_request`-event; zonder
  # dit filter draaide zo'n commit de poort tweemaal (push én pull_request).
  push:
    branches: [main, dev]
  pull_request:
  # `workflow_call` maakt deze poort herbruikbaar: `release.yml` roept hem op de getagde
  # commit aan, zodat een release door exact dezelfde vijf stappen (plus de zesde
  # verpakkingsbewaker) gaat als élke push op `main`/`dev`. De `push`- en
  # `pull_request`-triggers, de matrix en de jobnaam blijven ongewijzigd — de
  # branchbeveiliging op `main` hangt aan de checknamen `poort (3.12)`, `poort (3.13)` en
  # `poort (3.14)`, en die mogen niet verschuiven.
  workflow_call:

# Een nieuwe push op dezelfde ref maakt de lopende run overbodig: annuleer hem in plaats
# van hem te laten uitdraaien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poort:
    runs-on: ubuntu-latest
    strategy:
      # Alle drie de interpreters afmaken; een rode 3.13 of 3.14 mag de 3.12-uitslag niet
      # wegnemen.
      fail-fast: false
      matrix:
        # `requires-python = ">=3.12"` wordt zo op de ondergrens (3.12) én de bovengrens
        # (3.14, de nieuwste gedragen interpreter) getoetst in plaats van op een toevallige
        # interpreter. Kost 3x de runtime van één leg; de cache en het annuleren van
        # superseded runs hierboven betalen dat terug.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      # `--locked` faalt op een lockbestand dat niet bij `pyproject.toml` past: een
      # vergeten `uv lock` valt hier om in plaats van stil te worden weggewerkt.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check .
      - run: uv run mypy
      # pytest-cov komt uit de gelockte dev-groep, niet meer ongepind van PyPI via
      # `--with`; uv synct de dev-groep standaard mee.
      - run: uv run pytest -q --cov=gwsw_orox_helpers --cov-fail-under=95
      # Zesde stap, ná de vijf poortstappen: bouw wheel én sdist en laat er twee
      # verpakkingsbewakers overheen. `twine check` toetst de metadata en
      # `check-wheel-contents` de wheel-inhoud; samen borgen ze dat een release geen
      # agent-tooling of lokale paden meeneemt (issue #44). `uvx` haalt de twee tools los
      # van de gelockte set. De vijf stappen hierboven blijven de poort; dit is een bewaker
      # ernaast.
      - run: uv build && uvx twine check dist/* && uvx check-wheel-contents dist/*.whl
