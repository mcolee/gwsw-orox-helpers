name: toets
on:
  push:
  pull_request:
jobs:
  poort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run --with pytest-cov pytest -q --cov=gwsw_orox_helpers --cov-fail-under=95
