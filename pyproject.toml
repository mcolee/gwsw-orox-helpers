[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwsw-orox-helpers"
version = "0.2.2"
description = "Lezen, terugschrijven en ruimtelijk knippen van GWSW-OroX (TTL) rioleringsdatasets: grafmodel, geometrie, klassenhierarchie en cache."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Colee", email = "martin@colee.nl" }]
keywords = ["gwsw", "orox", "riolering", "rdf", "turtle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    # pyoxigraph levert de Rust-parser die het OroX-TTL ordegrootten sneller inleest dan
    # rdflib's pure-Python notation3.
    #
    # Bovengrenzen, want een verse install bij een afnemer mag niet stil een incompatibele
    # major/minor trekken:
    # - pyoxigraph is pre-1.0; 0.5 -> 0.6 mag de parse-signatuur breken.
    # - `_literal_string_snel` in `src/gwsw_orox_helpers/graaf.py` zet vier rdflib-INTERNE
    #   velden rechtstreeks (`_language`, `_datatype`, `_value`, `_ill_typed`), gebonden
    #   aan 7.x; rdflib 8 mag die hernoemen.
    # - shapely<3 is precautionair: geen bekend knelpunt, wel dezelfde major-risico's.
    "pyoxigraph>=0.5,<0.6",
    "rdflib>=7.0,<8",
    "shapely>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/mcolee/gwsw-orox-helpers"
Repository = "https://github.com/mcolee/gwsw-orox-helpers"
Changelog = "https://github.com/mcolee/gwsw-orox-helpers/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcolee/gwsw-orox-helpers/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    # De dekkingsstap van de poort. Staat hier (en dus in `uv.lock`) in plaats van als
    # `uv run --with pytest-cov ...`: dat haalde elke run een ongepinde versie van PyPI,
    # buiten de gelockte set om.
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gwsw_orox_helpers"]

# Expliciete allowlist voor de bron-tarbal (issue #44). Zonder deze sectie nam de sdist de
# hele werkboom mee -- agent-tooling (`.claude/`), CI (`.github/`), `CLAUDE.md`, `uv.lock`,
# `docs/agents/` en `manifesto.md`. `only-include` laat er precies de bron, de tests, de
# scripts, de architectuurschets en de PyPI-bestanden in. De gebundelde ontologieën en de
# testfixtures reizen mee omdat ze onder `src/` respectievelijk `tests/` vallen; de wheel
# blijft ongewijzigd (die heeft zijn eigen `wheel`-target hierboven).
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "scripts",
    "docs/architectuur.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
# Kanttekening: hatchling (1.32) `force_include`t de projecteigen `.gitignore` altijd in de
# sdist -- een `exclude` haalt hem er niet uit, want force-include wint. Dat is een gewoon,
# ongevaarlijk sdist-bestand (elke hatchling-sdist draagt het) en geen agent-tooling; de
# drifttest in `tests/test_sdist.py` verbiedt hem daarom niet, en de §3-controle van issue
# #44 (`\.claude|CLAUDE\.md|uv\.lock|\.github`) raakt hem evenmin.

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
# De fixturegenerator bevat GML-literalen die niet af te breken zijn zonder de
# TTL-uitvoer te veranderen.
"scripts/maak_fixtures.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
# `tests/typecheck` staat erbij en is geen gewone testmap: die modules draaien niet, ze
# zijn er om door mypy gelezen te worden. `graaflezer.py` bewijst dat `rdflib.Graph` en
# `graaf.GraafIndex` het `GraafLezer`-protocol allebei structureel vervullen -- een
# belofte die met een `assert` niet te toetsen is. De rest van `tests/` blijft erbuiten.
# `scripts` staat erbij sinds issue #20: de artefactgeneratoren (`maak_fixtures.py`,
# `maak_gwsw_index.py`) schrijven bestanden die in de repo gecommit staan en door
# drifttests bewaakt worden, en de benchmarks leunen op de publieke API. Ongecontroleerd
# gelaten drift daar valt pas op als een gegenereerd bestand al fout is. De rest van
# `tests/` blijft erbuiten: die is met de soepelste stand (`disallow_untyped_defs` uit)
# nog altijd 21 fouten van groen, vooral doordat pyoxigraph- en shapely-termen in
# testasserties versmald moeten worden. Dat is eigen werk, geen bijvangst van deze poort.
files = ["src/gwsw_orox_helpers", "tests/typecheck", "scripts"]
# shapely levert geen `py.typed` (2.1.2), dus zijn namen komen als `Any` binnen: een
# annotatie als `Point | LineString | Polygon` documenteert daar wel maar toetst niet.
# rdflib draagt sinds 7.x wél een `py.typed` en wordt dus gewoon meegecontroleerd.
ignore_missing_imports = true
# Elke functie draagt haar handtekening, in `src/`, in `tests/typecheck` en in `scripts/`.
# Zonder deze vlag glipt een ongeannoteerde def er ongemerkt door: mypy leest haar dan als
# `Any -> Any` en controleert noch het lichaam noch de aanroepen. Vier functies in `src/`
# stonden zo (issue #20).
disallow_untyped_defs = true
# De negatieve helft van dat bewijs: `# type: ignore[arg-type]` op een object dat het
# protocol *niet* vervult. Wordt zo'n regel ooit geldig -- omdat het protocol te breed
# werd of omdat `Graph` zijn typen kwijtraakt en `Any` wordt -- dan is de ignore
# ongebruikt en valt mypy alsnog om. `src/` draagt geen enkele `# type: ignore`, dus deze
# vlag kost daar niets en bewaakt hem meteen.
warn_unused_ignores = true

[tool.coverage.run]
# Takdekking (`has_arcs`), niet alleen regeldekking: zo telt een `if`/`except` die wel
# gedraaid wordt maar met maar één uitkomst als ongedekte tak. De poort meet de drempel
# hieronder daarmee (issue #54).
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `zwaar` draait tegen exports van honderden megabytes die niet in de repo zitten; die
# horen niet in de snelle poort. Draaien doe je ze expliciet: `pytest -m zwaar` (de
# `-m` van de opdrachtregel overschrijft deze).
addopts = ["-m", "not zwaar"]
markers = [
    "zwaar: draait tegen een niet-getrackte export van honderden MB; slaat zichzelf over als die ontbreekt",
]
